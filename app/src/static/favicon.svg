  </path>
  
  <!-- Check mark -->
  <path d="M24 32 L30 38 L42 26" 
        fill="none" 
        stroke="#090d16" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
